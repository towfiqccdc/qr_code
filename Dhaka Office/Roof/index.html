<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCDC Checkpoint Submission</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .form-container {
            background-color: #fff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            max-width: 450px;
            width: 100%;
        }

        /* Branding Section */
        .header-section {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #ee3124; /* CCDC Red Accent */
            padding-bottom: 15px;
        }

        .logo-placeholder {
            width: 80px;
            height: 80px;
            background-color: #eee;
            border: 2px dashed #ccc;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #888;
            border-radius: 8px;
        }

        .project-title {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a1a;
            margin: 0;
            text-transform: uppercase;
        }

        .well-info {
            font-size: 14px;
            color: #ee3124;
            font-weight: 600;
            margin-top: 5px;
        }

        h2 {
            text-align: center;
            margin: 15px 0 25px;
            color: #333;
            font-size: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
            font-size: 14px;
        }

        select, input[type="text"], input[type="file"], textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 15px;
            box-sizing: border-box;
        }

        textarea {
            resize: none;
            height: 80px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #ee3124; /* CCDC Red */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #c4271d;
        }

        #preview {
            display: none;
            width: 100%;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .success-message {
            display: none;
            text-align: center;
            color: #28a745;
            margin-top: 15px;
            font-weight: bold;
            padding: 10px;
            background: #e8f5e9;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="header-section">
        <div class="logo-placeholder"  style="border: none;">
            <img src="cnpc logo.png" alt="CCDC Logo" style="max-height: 80px; width: auto;">
        </div>
        <div class="project-title">CCDC Bangladesh Project</div>
        <div class="well-info">Dhaka Ofice</div>
    </div>

    <h2>Security Monitoring Report</h2>

    <form id="checkpointForm">
        <label for="checkpoint">Checkpoint Location</label>
        <input type="text" id="checkpoint" value="Roof" readonly>

        <label for="securityName">Security Officer Name</label>
        <input type="text" id="securityName" placeholder="Enter full name" required>

        <label for="status">Current Status</label>
        <select id="status" required>
            <option value="">-- Select --</option>
            <option value="OK">OK</option>
            <option value="Issue">Issue Reported</option>
            <option value="Assistance Required">Assistance Required</option>
        </select>

        <label for="comment">Observation Details</label>
        <textarea id="comment" placeholder="Any specific notes..."></textarea>

        <label for="photo">Take Evidence Photo</label>
        <input type="file" id="photo" accept="image/*" capture="camera">
        
        <img id="preview" src="" alt="Preview">

        <button type="submit" id="submitBtn">Submit Report</button>
    </form>

    <div class="success-message" id="successMsg">
        ✅ Report submitted to Titas-28 Database!
    </div>
</div>

<script>
    const form = document.getElementById('checkpointForm');
    const btn = document.getElementById('submitBtn');
    const photoInput = document.getElementById('photo');
    const preview = document.getElementById('preview');

    // Show preview when photo is selected
    photoInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
            }
            reader.readAsDataURL(file);
        }
    });

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        btn.disabled = true;
        btn.innerText = "Compressing & Uploading...";

        if (!navigator.geolocation) {
            alert("Geolocation is not supported by your browser.");
            btn.disabled = false;
            return;
        }

        navigator.geolocation.getCurrentPosition(async function(position) {
            try {
                let fileData = "";
                let fileName = "";

                if (photoInput.files.length > 0) {
                    const file = photoInput.files[0];
                    fileName = file.name;
                    
                    // --- COMPRESSION LOGIC (Crucial for Apps Script) ---
                    fileData = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            const img = new Image();
                            img.onload = () => {
                                const canvas = document.createElement('canvas');
                                const MAX_WIDTH = 800; 
                                const scaleSize = MAX_WIDTH / img.width;
                                canvas.width = MAX_WIDTH;
                                canvas.height = img.height * scaleSize;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                                // Returns 70% quality JPEG
                                resolve(canvas.toDataURL('image/jpeg', 0.7)); 
                            };
                            img.src = event.target.result;
                        };
                        reader.readAsDataURL(file);
                    });
                }

                const payload = {
                    checkpoint: document.getElementById('checkpoint').value,
                    securityName: document.getElementById('securityName').value,
                    status: document.getElementById('status').value,
                    comment: document.getElementById('comment').value,
                    lat: position.coords.latitude,
                    lon: position.coords.longitude,
                    fileData: fileData,
                    fileName: fileName
                };

                // PASTE YOUR WEB APP URL BELOW
                const url = "https://script.google.com/macros/s/AKfycbxZEagVt7BtKDVFkYsQTq2TrzNo2pPNxuAYLyVT8v-zFb296izMxhtcaGJWqP8fdhW9tw/exec";

                await fetch(url, {
                    method: 'POST',
                    mode: 'no-cors', // Keeps it simple for cross-domain
                    body: JSON.stringify(payload)
                });

                document.getElementById('successMsg').style.display = 'block';
                form.reset();
                preview.style.display = 'none';
                
                setTimeout(() => {
                    document.getElementById('successMsg').style.display = 'none';
                }, 5000);

            } catch (err) {
                alert("Error: " + err);
            } finally {
                btn.disabled = false;
                btn.innerText = "Submit Report";
            }
        }, (error) => {
            alert("Location access is required to submit.");
            btn.disabled = false;
            btn.innerText = "Submit Report";
        }, { enableHighAccuracy: true });
    });
</script>

</body>
</html>
