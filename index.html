<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkpoint Submission</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f9f9f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background-color: #fff; padding: 30px 40px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
        h2 { text-align: center; margin-bottom: 20px; color: #333; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        select, input[type="text"], textarea, input[type="file"] { width: 100%; padding: 10px 12px; margin-bottom: 20px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box; }
        textarea { resize: vertical; height: 80px; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: background-color 0.2s ease; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .success-message { display: none; text-align: center; color: green; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Checkpoint Submission</h2>
    <form id="checkpointForm">
        <label for="checkpoint">Checkpoint</label>
        <select id="checkpoint" required>
            <option value="">-- Select Checkpoint --</option>
            <option value="Gate">Gate</option>
            <option value="Warehouse">Warehouse</option>
            <option value="Office">Office</option>
            <option value="Tower">Tower</option>
            <option value="Storage">Storage</option>
        </select>

        <label for="status">Security Status</label>
        <select id="status" required>
            <option value="">-- Select Status --</option>
            <option value="OK">OK</option>
            <option value="Issue">Issue</option>
            <option value="Need Assistance">Need Assistance</option>
        </select>

        <label for="comment">Comment</label>
        <textarea id="comment" placeholder="Enter comment here..."></textarea>

        <label for="photo">Take Photo</label>
        <input type="file" id="photo" accept="image/*" capture="environment">

        <button type="submit" id="submitBtn">Submit</button>
    </form>
    <div class="success-message" id="successMsg">Form submitted successfully!</div>
</div>

<script>
const form = document.getElementById('checkpointForm');
const successMsg = document.getElementById('successMsg');
const submitBtn = document.getElementById('submitBtn');

// PASTE YOUR NEW DEPLOYMENT URL HERE
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxt9zrAeUQT7mycR8MuJiV2wr7VYELlYP8ubE55SMmWPXtJ4Cl4xrtXnm_AwE7lB44B/exec";

form.addEventListener('submit', function(e) {
    e.preventDefault();

    if(!navigator.geolocation){ 
        alert("Geolocation not supported by your browser."); 
        return; 
    }

    // 1. Start Loading State
    submitBtn.disabled = true;
    submitBtn.innerText = "Submitting...";

    navigator.geolocation.getCurrentPosition(async function(position) {
        try {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            const checkpoint = document.getElementById('checkpoint').value;
            const status = document.getElementById('status').value;
            const comment = document.getElementById('comment').value;
            const photoFile = document.getElementById('photo').files[0];

            let imageBase64 = "";
            if(photoFile){
                imageBase64 = await fileToBase64(photoFile);
            }

            // 2. Send Data
            await fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors", // Bypasses CORS preflight
                cache: "no-cache",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8",
                },
                body: JSON.stringify({
                    checkpoint,
                    status,
                    comment,
                    gps: `${lat},${lon}`,
                    image: imageBase64
                })
            });

            // 3. Handle Success (UI side)
            successMsg.style.display = "block";
            form.reset(); 
            
            setTimeout(() => { 
                successMsg.style.display = "none"; 
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit";
            }, 3000);

        } catch (err) {
            console.error(err);
            alert("Error submitting form. Please try again.");
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit";
        }

    }, function(err){
        alert("Location access denied. Please enable GPS to submit.");
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit";
    }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
});

function fileToBase64(file){
    return new Promise((resolve, reject)=>{
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = err => reject(err);
    });
}
</script>
</body>
</html>
