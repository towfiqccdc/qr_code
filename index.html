<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkpoint Submission</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .form-container {
            background-color: #fff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        select, input[type="text"], input[type="file"], textarea {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .success-message {
            display: none;
            text-align: center;
            color: green;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Checkpoint Submission</h2>

    <form id="checkpointForm">

        <label for="checkpoint">Checkpoint</label>
        <select id="checkpoint" required>
            <option value="">-- Select Checkpoint --</option>
            <option value="Gate">Gate</option>
            <option value="Warehouse">Warehouse</option>
            <option value="Office">Office</option>
            <option value="Tower">Tower</option>
            <option value="Storage">Storage</option>
        </select>

        <label for="status">Security Status</label>
        <select id="status" required>
            <option value="">-- Select Status --</option>
            <option value="OK">OK</option>
            <option value="Issue">Issue</option>
            <option value="Need Assistance">Need Assistance</option>
        </select>

        <label for="comment">Comment</label>
        <textarea id="comment" placeholder="Enter comment here..."></textarea>

        <label for="photo">Upload Photo</label>
        <!-- 'capture' attribute opens the camera directly on mobile -->
        <input type="file" id="photo" accept="image/*" capture="camera">

        <button type="submit" id="submitBtn">Submit Report</button>

    </form>

    <div class="success-message" id="successMsg">
        Form submitted successfully!
    </div>
</div>

<script>
    const form = document.getElementById('checkpointForm');
    const successMsg = document.getElementById('successMsg');
    const btn = document.getElementById('submitBtn');

    // Helper function to convert file to Base64
    const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        // Disable button to prevent double submission
        btn.disabled = true;
        btn.innerText = "Uploading... Please wait";

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async function(position) {
                
                try {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    const fileInput = document.getElementById('photo');
                    let fileData = "";
                    let fileName = "";

                    // If a file is selected, convert it
                    if (fileInput.files.length > 0) {
                        const file = fileInput.files[0];
                        fileName = file.name;
                        fileData = await toBase64(file);
                    }

                    // Prepare the data object
                    const payload = {
                        checkpoint: document.getElementById('checkpoint').value,
                        status: document.getElementById('status').value,
                        comment: document.getElementById('comment').value,
                        lat: lat,
                        lon: lon,
                        fileData: fileData,
                        fileName: fileName
                    };

                    // Replace with your Web App URL after re-deploying as "POST"
                    const url = "https://script.google.com/macros/s/AKfycbwW0kByucMg1VUUmEQ4vTqkbxGCAb-F9NVfDvAA7p63qLyieKGCC1rhv7f8owoMGe1W/exec";

                    const response = await fetch(url, {
                        method: 'POST',
                        mode: 'no-cors', // Essential for Apps Script cross-domain
                        cache: 'no-cache',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    // Update UI
                    successMsg.style.display = 'block';
                    form.reset();
                    
                    setTimeout(() => {
                        successMsg.style.display = 'none';
                    }, 5000);

                } catch (error) {
                    console.error(error);
                    alert("Error submitting the form. Check console.");
                } finally {
                    btn.disabled = false;
                    btn.innerText = "Submit Report";
                }

            }, function(error) {
                alert("Please allow location access to submit the form.");
                btn.disabled = false;
                btn.innerText = "Submit Report";
            }, {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            });
        } else {
            alert("Geolocation is not supported by this browser.");
            btn.disabled = false;
            btn.innerText = "Submit Report";
        }
    });
</script>

</body>
</html>
