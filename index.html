<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkpoint Submission</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .form-container {
        background-color: #fff;
        padding: 30px 40px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        max-width: 400px;
        width: 100%;
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #555;
    }

    select, input[type="text"], textarea {
        width: 100%;
        padding: 10px 12px;
        margin-bottom: 20px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 14px;
        box-sizing: border-box;
    }

    textarea {
        resize: vertical;
        height: 80px;
    }

    button {
        width: 100%;
        padding: 12px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.2s ease;
    }

    button:hover {
        background-color: #0056b3;
    }

    .success-message {
        display: none;
        text-align: center;
        color: green;
        margin-top: 15px;
        font-weight: bold;
    }
</style>
</head>
<body>

<div class="form-container">
    <h2>Checkpoint Submission</h2>

    <form id="checkpointForm">

        <label for="checkpoint">Checkpoint</label>
        <select id="checkpoint" required>
            <option value="">-- Select Checkpoint --</option>
            <option value="Gate">Gate</option>
            <option value="Warehouse">Warehouse</option>
            <option value="Office">Office</option>
            <option value="Tower">Tower</option>
            <option value="Storage">Storage</option>
        </select>

        <label for="status">Security Status</label>
        <select id="status" required>
            <option value="">-- Select Status --</option>
            <option value="OK">OK</option>
            <option value="Issue">Issue</option>
            <option value="Need Assistance">Need Assistance</option>
        </select>

        <label for="comment">Comment</label>
        <textarea id="comment" placeholder="Enter comment here..."></textarea>

        <button type="submit">Submit</button>

    </form>

    <div class="success-message" id="successMsg">
        Form submitted successfully!
    </div>
</div>

<script>

const form = document.getElementById('checkpointForm');
const successMsg = document.getElementById('successMsg');

form.addEventListener('submit', function(e){

    e.preventDefault();

    if (navigator.geolocation) {

        navigator.geolocation.getCurrentPosition(

        function(position) {

            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            const checkpoint = encodeURIComponent(document.getElementById('checkpoint').value);
            const status = encodeURIComponent(document.getElementById('status').value);
            const comment = encodeURIComponent(document.getElementById('comment').value);

            const url =
            "https://script.google.com/macros/s/AKfycbwj-BLCYps2H4Z3PJL4SJdascoslH7XD-SaO88EAGJ7dxsFDTeoRzGxJoRVAn2yWXSB/exec" +
            `?checkpoint=${checkpoint}&status=${status}&comment=${comment}&lat=${lat}&lon=${lon}`;

            fetch(url)
                .then(response => response.text())
                .then(data => {

                    successMsg.style.display = 'block';

                    setTimeout(() => {
                        successMsg.style.display = 'none';
                    }, 3000);

                })
                .catch(error => {

                    alert("Error submitting the form. Please try again.");
                    console.error(error);

                });

        },

        function(error){

            alert("Please allow location access to submit the form.");

        },

        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        }

        );

    }

    else {

        alert("Geolocation is not supported by this browser.");

    }

});

</script>

</body>
</html>
